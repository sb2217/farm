<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — KisanMart</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background:var(--champagne);">
<div class="success-page">
  <div class="success-card">
    <div class="success-icon-wrap">
      <i class="fa-solid fa-check"></i>
    </div>
    <h1 data-i18n="successTitle">Order Confirmed</h1>
    <p data-i18n="successMsg">Thank you for your order. We will deliver within 3 to 5 business days.</p>
    <div class="success-order-id" id="order-info">Your order is being processed.</div>
    <div id="order-summary-table" style="text-align:left;width:100%;margin-bottom:24px;"></div>
    <div class="success-buttons">
      <a id="whatsapp-share" href="#" target="_blank" class="btn btn-gold">
        <i class="fa-brands fa-whatsapp"></i> <span data-i18n="successWhatsapp">Share on WhatsApp</span>
      </a>
      <a href="index.html" class="btn btn-royal" data-i18n="successShop">
        <i class="fa-solid fa-store"></i> Continue Shopping
      </a>
    </div>
  </div>
</div>
<script src="js/i18n.js"></script>
<script src="js/products.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  applyTranslations();
  const params = new URLSearchParams(window.location.search);
  const method = params.get('method') || 'razorpay';
  const orderId = params.get('id') || 'ORD' + Date.now();
  const methodLabel = method === 'cod' ? 'Cash on Delivery' : 'Razorpay / UPI';
  document.getElementById('order-info').innerHTML = `Order ID: <strong>${orderId}</strong> &nbsp;|&nbsp; Payment: ${methodLabel}`;
  const lastOrder = JSON.parse(localStorage.getItem('kisanmart_last_order') || 'null');
  const summaryEl = document.getElementById('order-summary-table');
  if (lastOrder && lastOrder.items) {
    summaryEl.innerHTML = `
      <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
        <thead><tr style="background:var(--royal-pale);"><th style="padding:9px;text-align:left;font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.06em;color:var(--royal-mid);">Product</th><th style="padding:9px;text-align:center;font-family:'Cinzel',serif;font-size:0.72rem;color:var(--royal-mid);">Qty</th><th style="padding:9px;text-align:right;font-family:'Cinzel',serif;font-size:0.72rem;color:var(--royal-mid);">Price</th></tr></thead>
        <tbody>${lastOrder.items.map(item => `<tr style="border-bottom:1px solid var(--border);"><td style="padding:9px;">${item.name}</td><td style="padding:9px;text-align:center;">${item.qty}</td><td style="padding:9px;text-align:right;font-weight:700;">Rs. ${(item.price * item.qty).toLocaleString('en-IN')}</td></tr>`).join('')}<tr><td colspan="2" style="padding:11px 9px;font-family:'Cinzel',serif;font-weight:700;color:var(--royal-deep);">Total</td><td style="padding:11px 9px;text-align:right;font-family:'Cinzel',serif;font-weight:700;color:var(--royal-deep);">Rs. ${lastOrder.total.toLocaleString('en-IN')}</td></tr></tbody>
      </table>`;
  }
  const waMsg = encodeURIComponent(`I just placed an order on KisanMart!\nOrder ID: ${orderId}\nPayment: ${method === 'cod' ? 'Cash on Delivery' : 'Online'}\n\nOrganic fertilizers delivered to your farm: https://sb2217.github.io/farm/`);
  document.getElementById('whatsapp-share').href = `https://wa.me/?text=${waMsg}`;
});
</script>
</body>
</html>
